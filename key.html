<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Required</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #a792df 0%, #61449b 100%);
        }
        .card {
            background: white;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 320px;
        }
        .display-area {
            border-bottom: 2px solid #333333;
            margin-bottom: 25px;
            padding-bottom: 15px;
        }
        h3 { margin: 0; color: #4a4a4a; font-size: 1.3em; font-weight: 500; }
        input {
            width: 90%;
            padding: 14px;
            font-size: 1.1em;
            text-align: center;
            margin-bottom: 15px;
            border: none;
            background-color: #f3f4f9;
            color: #556ee6;
            border-radius: 8px;
            font-weight: bold;
            letter-spacing: 1px;
            outline: none;
        }
        input::placeholder { color: #a0a5ba; font-weight: normal; }
        button {
            width: 99%;
            padding: 14px;
            background: #72d572;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 10px rgba(114, 213, 114, 0.3);
        }
        button:hover { background: #5fc45f; }
        button:disabled { background: #cccccc; cursor: not-allowed; box-shadow: none; }
        #error { color: #f46e6e; margin-top: 15px; font-size: 0.9em; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div class="display-area">
        <h3>Verification Required</h3>
    </div>
    <input type="text" id="keyInput" placeholder="Enter 20-character key" maxlength="20">
    <button id="submitBtn" onclick="checkKey()">Verify & Enter</button>
    <div id="error"></div>
</div>

<script>
// !!! PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE !!!
const GOOGLE_API_URL = "https://script.google.com/macros/s/AKfycbxsm9hymlZD-K2eKXjQXemDyqK3gvdrN6icswvVSKbLobEnQVJ9QPdG7fX6o5bWeFnuUQ/exe";

// Generates or reads a hardware tracking token unique to this browser installation profile
function getOrCreateHardwareId() {
    let hid = localStorage.getItem('device_hardware_fingerprint');
    if (!hid) {
        hid = 'HID-' + Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        localStorage.setItem('device_hardware_fingerprint', hid);
    }
    return hid;
}

async function checkKey() {
    const key = document.getElementById('keyInput').value.trim();
    const errorDiv = document.getElementById('error');
    const btn = document.getElementById('submitBtn');
    errorDiv.innerText = "";

    // 1. Structural Validation Checks
    if (key.length !== 20) {
        errorDiv.innerText = "son😭😭😭.";
        return;
    }

    for (let i = 0; i < key.length - 1; i++) {
        if (key.charAt(i) === key.charAt(i + 1)) {
            errorDiv.innerText = "son😭😭😭";
            return;
        }
    }

    const dateBlock = key.substring(7, 11);
    if (isNaN(dateBlock) || dateBlock.length !== 4) {
        errorDiv.innerText = "son😭😭😭";
        return;
    }

    const yearDigit = parseInt(dateBlock.charAt(0));
    const dayOfYear = parseInt(dateBlock.substring(1, 4));
    if (dayOfYear < 1 || dayOfYear > 366) {
        errorDiv.innerText = "son😭😭😭";
        return;
    }

    const now = new Date();
    now.setHours(0, 0, 0, 0);
    const currentYear = now.getFullYear();
    let candidateDates = [];

    for (let offset = -1; offset <= 10; offset++) {
        let testYear = currentYear + offset;
        if (testYear % 10 === yearDigit) {
            let testDate = new Date(testYear, 0, 0); 
            testDate.setDate(testDate.getDate() + dayOfYear);
            testDate.setHours(0, 0, 0, 0);
            candidateDates.push(testDate);
        }
    }

    let expiryDate = null;
    if (candidateDates.length > 0) {
        candidateDates.sort((a, b) => a - b);
        expiryDate = candidateDates.find(date => date >= now);
        if (!expiryDate) {
            expiryDate = candidateDates[candidateDates.length - 1];
        }
    }

    if (!expiryDate || now > expiryDate) {
        errorDiv.innerText = "key has expired";
        return;
    }

    // 2. Database Connection Audit Layer
    const hardwareId = getOrCreateHardwareId();
    btn.disabled = true;
    errorDiv.style.color = "#556ee6";
    errorDiv.innerText = "Checking secure database...";

    try {
        const response = await fetch(GOOGLE_API_URL, {
            method: "POST",
            mode: "cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({ key: key, hardwareId: hardwareId })
        });
        
        const result = await response.json();
        errorDiv.style.color = "#f46e6e";

        if (result.status === "SUCCESS") {
            // Commit key locally to bind device profile state rules
            localStorage.setItem('assigned_license_key', key);
            
            // Write short term authorization ticket to sessionStorage to fix GitHub Pages suffix limits
            sessionStorage.setItem('session_handshake_auth', key);
            
            window.location.href = "site.html";
        } else {
            errorDiv.innerText = result.message;
            btn.disabled = false;
        }
    } catch (err) {
        errorDiv.style.color = "#f46e6e";
        errorDiv.innerText = "Database connection error. Try again.";
        btn.disabled = false;
    }
}
</script>

</body>
</html>
