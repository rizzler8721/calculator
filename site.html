    <title>Link's Calculator</title>
    <script>
        // PHASE 1 SECURITY: Run instantly before building any layout architecture
        (function() {
            // Read hardware bounding fingerprints and saved key properties
            const identityKey = localStorage.getItem('assigned_license_key');
            const hardwareId = localStorage.getItem('device_hardware_fingerprint');
            
            // Read the clean short term session token string out of sessionStorage
            const activeHandshakeToken = sessionStorage.getItem('session_handshake_auth');

            // FALLBACK CONTEXT AUDIT: Check if the browser arrived directly from local activation forms
            const allowedReferrer = "key.html";
            const currentReferrer = document.referrer.toLowerCase();
            const freshRedirect = currentReferrer.includes(allowedReferrer) || currentReferrer.includes("rizzler8721.github.io");

            // CRITICAL SYSTEM INTEGRITY AUDIT:
            // Allow entry if state keys match local memory pools, OR if a fresh gateway form transfer occurred
            const identityMatched = (identityKey && hardwareId && activeHandshakeToken === identityKey);
            
            if (!identityMatched && !freshRedirect) {
                // Instantly push bookmarks or link shared bypass tricks to unauthorized.html
                window.location.replace("unauthorized.html");
            }
        })();
    </script>
    <style>

        .tile:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12); }
        .tile img { display: block; width: 100%; height: 180px; object-fit: cover; }

<script>
    // PHASE 3 SECURITY: If validation passes, reveal the core grid safely
    document.getElementById('application-content-canvas').style.display = 'block';

    const search = document.querySelector('.search');
    const tiles = document.querySelectorAll('.tile');

    function filterTiles() {
        const query = search.value.trim().toLowerCase();
        tiles.forEach(tile => {
            const name = [
                tile.dataset.lessons,
                tile.getAttribute('title'),
                tile.querySelector('img')?.alt
            ].filter(Boolean).join(' ').toLowerCase();
            
            const isMatch = name.includes(query);
            if (query === '') {
                tile.style.display = 'block';
                tile.style.order = '0';
            } else if (isMatch) {
                tile.style.display = 'block';
                tile.style.order = '-1';
            } else {
                tile.style.display = 'none';
                tile.style.order = '0';
            }
        });
    }
    search.addEventListener('input', filterTiles);
</script>
